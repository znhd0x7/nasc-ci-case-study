# ab-check v2.2 (25 Nov 2026). Same-VM A/B check, started by hand (Actions tab > ab-check > Run workflow).
# v2.2 (25 Nov 2026): input "copies" (1-4) runs that many identical "ab" jobs in parallel, each on its
#   own VM (the runner fleet mixes Intel and AMD, and we cannot choose). Each copy uploads its own
#   artifact (...-copy<N>). The "summary" job downloads them and runs "ab_check.py pool": the
#   difference per CPU type (pairs pooled within a type) and per copy, in the job summary and in the
#   artifact ...-summary. If the summary job fails, the copies' artifacts are complete and the same
#   command can be run on the downloaded folders. Runner minutes grow with copies; wall time does not.
# v2.1 (25 Nov 2026): benchmarks left empty -> the patch's benchmarks from case-study/injections/
#   targets.txt (heapsort: heapSort80,heapSort250,heapSort320; indexof: serialIndexOf250), or
#   heapSort80,serialIndexOf250 without a patch; a warning if a given list misses a patched benchmark;
#   the benchmarks used are printed in the log and at the top of the report; the artifact is named
#   after the inputs and the run id, so two downloads cannot be mixed up.
# v2 (25 Nov 2026): optional input "patch" (heapsort or indexof) applies an injection patch from
#   case-study/injections/ to commit B only, so A and B may be the same commit (clean vs injected).
#   The patch is applied with "git apply --check" first, copied into the artifact with its sha256,
#   and the report gives the injected slowdown labelled with the CPU model it was measured on.
#   Calibration runs: a=9, b=9, patch=heapsort, benchmarks=heapSort80,heapSort250,heapSort320
#   (60 runs, about 31 min of measuring); a=13, b=13, patch=indexof, benchmarks=serialIndexOf250
#   (20 runs, about 10 min).
#   test  the unit tests and the NASC-CI version stamp, before any runner time is spent on JMH;
#         reads the two commits from case-study/commits.txt (default positions 1 and 2)
#   ab    ONE job (one VM) builds both commits and runs case-study/ab_check.py: for each benchmark
#         (default heapSort80 and serialIndexOf250) 10 pairs of back-to-back runs of commit B and
#         commit A, in NASC-CI 0.3's ABBA order (odd pairs B first, even pairs A first), benchmarks
#         taking turns. Every run: JMH -bm sample -tu ns -f 1 -wi 10 -i 20 -w 1s -r 1s -foe true.
#         The report gives B vs A for "candidate first" and "reference first" separately, the
#         order-balanced difference, the order effect and the same-VM noise (c_w, c_t).
#         CPU model (nasc_ci machine + lscpu) and the compiled-code hash of both commits are logged.
# Expected: 40 runs x about 31 s = about 21 minutes of measuring; about 25 runner minutes in all.
# Java is Temurin 8.0.514+1 (1.8.0_514-b01), set up exactly as in build-check v3 and pilot v1:
# checksum verification on, two retries (after 60 s and 180 s), the verified JDK cached (cache-jdk),
# a clear stop if all three fail, never another JDK (Java setup v2, 25 Nov 2026).
# The artifact is kept 90 days; copy it into the private results folder before then.
name: ab-check

on:
  workflow_dispatch:
    inputs:
      a:
        description: "Position of commit A, the reference (case-study/commits.txt)"
        default: "1"
      b:
        description: "Position of commit B, the candidate"
        default: "2"
      benchmarks:
        description: "Benchmarks (short names, comma-separated). Empty: the patch's benchmarks, or heapSort80,serialIndexOf250 without a patch"
        default: ""
      pairs:
        description: "Pairs per benchmark (even, so both orders get the same number)"
        default: "10"
      patch:
        description: "Injection patch applied to commit B only (case-study/injections/<name>.patch)"
        type: choice
        options: [none, heapsort, indexof]
        default: none
      copies:
        description: "Identical A/B jobs in parallel, each on its own VM (to measure more than one CPU type)"
        type: choice
        options: ["1", "2", "3", "4"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: measurements
  cancel-in-progress: false

env:
  POS_A: ${{ inputs.a }}
  POS_B: ${{ inputs.b }}
  BENCHMARKS: ${{ inputs.benchmarks }}
  PAIRS: ${{ inputs.pairs }}
  PATCH: ${{ inputs.patch }}
  COPIES: ${{ inputs.copies }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha_a: ${{ steps.read.outputs.sha_a }}
      sha_b: ${{ steps.read.outputs.sha_b }}
      benchmarks: ${{ steps.read.outputs.benchmarks }}
      copies: ${{ steps.read.outputs.copies }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Unit tests
        run: |
          pip install numpy pandas pytest
          python -m pytest -q tests
      - name: Check the NASC-CI version stamp
        run: |
          python -c "import nasc_ci; print(nasc_ci.VERSION)"
          grep -Eq '^[0-9a-f]{40}$' nasc_ci/VERSION || { echo "::error title=No version stamp::nasc_ci/VERSION must hold one 40-character commit hash"; exit 1; }
          echo "NASC-CI source: $(cat nasc_ci/VERSION)"
      - id: read
        name: Check the inputs and pick the two commits
        run: |
          python3 -c "
          import os, re, sys
          a, b, pairs, patch = os.environ['POS_A'], os.environ['POS_B'], os.environ['PAIRS'], os.environ['PATCH']
          if not (a.isdigit() and b.isdigit()):
              sys.exit('::error::positions must be numbers')
          if patch not in ('none', 'heapsort', 'indexof'):
              sys.exit('::error::patch must be none, heapsort or indexof')
          if a == b and patch == 'none':
              sys.exit('::error::A and B may be the same commit only when a patch is applied to B')
          if patch != 'none' and not os.path.isfile(f'case-study/injections/{patch}.patch'):
              sys.exit(f'::error::case-study/injections/{patch}.patch is missing')
          if not (pairs.isdigit() and int(pairs) >= 2 and int(pairs) % 2 == 0):
              sys.exit('::error::pairs must be an even number, 2 or more')
          targets = {l.split()[0]: l.split()[2].split(',') for l in open('case-study/injections/targets.txt')
                     if l.strip() and not l.startswith('#')}
          bench = os.environ['BENCHMARKS'].replace(' ', '')
          if not bench:
              bench = ','.join(targets[patch]) if patch != 'none' else 'heapSort80,serialIndexOf250'
          if not re.fullmatch(r'[A-Za-z0-9_]+(,[A-Za-z0-9_]+)*', bench):
              sys.exit('::error::benchmarks must be short names separated by commas')
          missing = [t for t in targets.get(patch, []) if t not in bench.split(',')]
          if missing:
              print(f'::warning title=Patched benchmarks not measured::{patch} also slows down {\",\".join(missing)}', file=sys.stderr)
          print(f'Benchmarks: {bench}', file=sys.stderr)
          print(f'benchmarks={bench}')
          copies = os.environ['COPIES']
          if copies not in ('1', '2', '3', '4'):
              sys.exit('::error::copies must be 1, 2, 3 or 4')
          print('copies=' + str(list(range(1, int(copies) + 1))))
          rows = {p: s for p, s in (l.split()[:2] for l in open('case-study/commits.txt') if l.strip() and not l.startswith('#'))}
          for side, pos in (('a', a), ('b', b)):
              if pos not in rows:
                  sys.exit(f'::error::position {pos} is not in case-study/commits.txt')
              print(f'sha_{side}={rows[pos]}')
          " >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  ab:
    needs: test
    name: A/B commit ${{ inputs.a }} vs ${{ inputs.b }}${{ inputs.patch != 'none' && format(' + {0} patch', inputs.patch) || '' }}, copy ${{ matrix.copy }} of ${{ inputs.copies }}
    strategy:
      fail-fast: false
      matrix:
        copy: ${{ fromJSON(needs.test.outputs.copies) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Start the clock
        run: mkdir -p out && echo "job_start=$(date +%s)" > out/timing.txt
      - name: Check out the case-study files
        uses: actions/checkout@v7
        with:
          path: tools
      - name: Check out jenetics at commit A (reference)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha_a }}
          path: a-src
      - name: Check out jenetics at commit B (candidate)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha_b }}
          path: b-src
      - name: Apply the injection patch to commit B
        if: inputs.patch != 'none'
        run: |
          P="$PWD/tools/case-study/injections/$PATCH.patch"
          git -C b-src apply --check "$P"
          git -C b-src apply "$P"
          git -C b-src diff --stat
          cp "$P" out/
          sha256sum "$P" | sed 's|  .*/|  |' | tee out/patch-sha256.txt
      # Java setup v2 (25 Nov 2026): cache-jdk keeps the verified JDK in the GitHub cache under a key made of the
      # exact version and Adoptium's expected sha256, so later jobs restore it instead of downloading;
      # it is saved only after a download that passed the checksum, and only if the job succeeds.
      # A failed download is retried twice: after 60 s and after another 180 s.
      - name: Set up Java 8 (Temurin 8.0.514+1)
        id: java1
        continue-on-error: true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8.0.514+1"
          cache-jdk: true
      - name: Pause and clear the failed Java download
        if: steps.java1.outcome == 'failure'
        run: |
          echo "First Java setup failed; waiting 60 s and retrying from scratch."
          rm -rf "$RUNNER_TOOL_CACHE/Java_Temurin-Hotspot_jdk/8.0.514-1"
          sleep 60
      - name: Set up Java 8 (Temurin 8.0.514+1), second try
        id: java2
        if: steps.java1.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8.0.514+1"
          cache-jdk: true
      - name: Pause longer and clear the failed Java download
        if: steps.java1.outcome == 'failure' && steps.java2.outcome == 'failure'
        run: |
          echo "Second Java setup failed; waiting 180 s and retrying from scratch."
          rm -rf "$RUNNER_TOOL_CACHE/Java_Temurin-Hotspot_jdk/8.0.514-1"
          sleep 180
      - name: Set up Java 8 (Temurin 8.0.514+1), third try
        id: java3
        if: steps.java1.outcome == 'failure' && steps.java2.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8.0.514+1"
          cache-jdk: true
      - name: Stop if Java could not be set up
        if: steps.java1.outcome == 'failure' && steps.java2.outcome != 'success' && steps.java3.outcome != 'success'
        run: |
          echo "::error title=Java setup failed three times::Temurin 8.0.514+1 could not be downloaded and verified. Re-run this job (Re-run failed jobs); do not change the JDK."
          exit 1
      - name: Check the JDK build
        run: |
          java -version 2>&1 | tee out/jdk.txt
          grep -q "Temurin" out/jdk.txt && grep -q "1.8.0_514-b01" out/jdk.txt || {
            echo "::error title=Wrong JDK::expected Temurin 1.8.0_514-b01"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install numpy
        run: |
          pip install numpy
          pip freeze > out/python-packages.txt
      - name: Log the CPU model of this VM
        working-directory: tools
        run: |
          python3 -m nasc_ci machine --out ../out/machine.json
          lscpu > ../out/lscpu.txt
          grep -m1 "model name" /proc/cpuinfo
      - name: Build both JMH jars
        run: |
          for side in a b; do
            ( cd $side-src && chmod +x gradlew && ./gradlew --no-daemon --console=plain \
                --init-script ../tools/case-study/print-jmh-classpath.gradle \
                :jenetics:jmhJar :jenetics:printJmhClasspath )
            JAR=$(ls $side-src/jenetics/build/libs/*-jmh.jar | head -1)
            echo "$PWD/$JAR:$(cat $side-src/jenetics/build/jmh-classpath.txt)" > $side-classpath.txt
          done
      - name: Hash the compiled code of both commits
        working-directory: tools
        run: |
          for side in a b; do
            python3 -m nasc_ci codehash ../$side-src/jenetics/build/classes/java/main \
              ../$side-src/jenetics/build/classes/java/jmh --out ../out/code-$side.json
          done
      - name: A/B runs and the report (about 10 to 31 minutes, see the header)
        env:
          BENCH: ${{ needs.test.outputs.benchmarks }}
        run: |
          set -o pipefail
          echo "Benchmarks: $BENCH ($PAIRS pairs each)"
          PATCH_ARG=()
          if [ "$PATCH" != "none" ]; then PATCH_ARG=(--b-patch "tools/case-study/injections/$PATCH.patch"); fi
          python3 tools/case-study/ab_check.py run \
            --a ${{ needs.test.outputs.sha_a }} --b ${{ needs.test.outputs.sha_b }} \
            --a-pos "$POS_A" --b-pos "$POS_B" --a-cp a-classpath.txt --b-cp b-classpath.txt \
            --bench "$BENCH" --pairs "$PAIRS" --out out \
            --machine out/machine.json --code-a out/code-a.json --code-b out/code-b.json \
            --timing out/timing.txt --copy ${{ matrix.copy }} "${PATCH_ARG[@]}" 2>&1 | tee out/ab-check.log
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ab-check-a${{ inputs.a }}-b${{ inputs.b }}-${{ inputs.patch }}-run${{ github.run_id }}-copy${{ matrix.copy }}
          path: out/
          retention-days: 90
          if-no-files-found: error

  summary:
    needs: [test, ab]
    if: always() && needs.test.result == 'success'
    name: Summary per CPU type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install numpy
        run: pip install numpy
      - name: Download the copies
        uses: actions/download-artifact@v7
        with:
          pattern: ab-check-a${{ inputs.a }}-b${{ inputs.b }}-${{ inputs.patch }}-run${{ github.run_id }}-copy*
          path: copies
      - name: Pool the copies per CPU type
        run: |
          set -o pipefail
          ls copies
          mkdir -p summary
          python3 case-study/ab_check.py pool copies/*/ab.json --out summary | tee summary/pool.log
          cat summary/pool.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ab-check-a${{ inputs.a }}-b${{ inputs.b }}-${{ inputs.patch }}-run${{ github.run_id }}-summary
          path: summary/
          retention-days: 90
          if-no-files-found: warn
