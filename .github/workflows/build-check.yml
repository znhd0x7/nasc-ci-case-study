# build-check v3 (24 Nov 2026). Build check (no measurement): for each studied commit, build the JMH
# benchmarks on Java 8 and check that all 16 case-study benchmarks are there.
# Started by hand (Actions tab > build-check > Run workflow).
# v2: the 2019 jmhJar does not contain JMH itself (plugin 0.4.5 packs no jmh-core), so JMH runs from
# the class path Gradle resolves, written by case-study/print-jmh-classpath.gradle (an init script
# applied from outside; no jenetics file is changed).
# v3: Java is pinned to Temurin 8.0.514+1 (1.8.0_514-b01), the build all studied runs must use.
# A failed download is retried once after a pause, from scratch, with checksum verification kept on;
# if both fail the job stops with a clear error (it never falls back to another JDK).
# Java setup v2 (25 Nov 2026): a second retry after 180 s more, and the verified JDK is cached
# (setup-java cache-jdk, key = exact version + Adoptium's expected sha256), so later jobs skip the download.
name: build-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.read.outputs.commits }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Read case-study/commits.txt
        run: |
          python3 -c "
          import json
          rows = [l.split()[:2] for l in open('case-study/commits.txt') if l.strip() and not l.startswith('#')]
          print('commits=' + json.dumps([{'pos': int(p), 'sha': s} for p, s in rows]))
          " >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: list
    name: build ${{ matrix.pos }} (${{ matrix.sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list.outputs.commits) }}
    steps:
      - name: Check out the case-study files
        uses: actions/checkout@v7
        with:
          path: tools
      - name: Check out jenetics at the studied commit
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.sha }}
          path: jenetics-src
      # Java setup v2 (25 Nov 2026): cache-jdk keeps the verified JDK in the GitHub cache under a key made of the
      # exact version and Adoptium's expected sha256, so later jobs restore it instead of downloading;
      # it is saved only after a download that passed the checksum, and only if the job succeeds.
      # A failed download is retried twice: after 60 s and after another 180 s.
      - name: Set up Java 8 (Temurin 8.0.514+1)
        id: java1
        continue-on-error: true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8.0.514+1"
          cache-jdk: true
      - name: Pause and clear the failed Java download
        if: steps.java1.outcome == 'failure'
        run: |
          echo "First Java setup failed; waiting 60 s and retrying from scratch."
          rm -rf "$RUNNER_TOOL_CACHE/Java_Temurin-Hotspot_jdk/8.0.514-1"
          sleep 60
      - name: Set up Java 8 (Temurin 8.0.514+1), second try
        id: java2
        if: steps.java1.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8.0.514+1"
          cache-jdk: true
      - name: Pause longer and clear the failed Java download
        if: steps.java1.outcome == 'failure' && steps.java2.outcome == 'failure'
        run: |
          echo "Second Java setup failed; waiting 180 s and retrying from scratch."
          rm -rf "$RUNNER_TOOL_CACHE/Java_Temurin-Hotspot_jdk/8.0.514-1"
          sleep 180
      - name: Set up Java 8 (Temurin 8.0.514+1), third try
        id: java3
        if: steps.java1.outcome == 'failure' && steps.java2.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8.0.514+1"
          cache-jdk: true
      - name: Stop if Java could not be set up
        if: steps.java1.outcome == 'failure' && steps.java2.outcome != 'success' && steps.java3.outcome != 'success'
        run: |
          echo "::error title=Java setup failed three times::Temurin 8.0.514+1 could not be downloaded and verified. Re-run this job (Re-run failed jobs); do not change the JDK."
          exit 1
      - name: Check the JDK build
        run: |
          java -version 2>&1 | tee jdk.txt
          grep -q "Temurin" jdk.txt && grep -q "1.8.0_514-b01" jdk.txt || {
            echo "::error title=Wrong JDK::expected Temurin 1.8.0_514-b01"; exit 1; }
      - name: Build the JMH jar
        working-directory: jenetics-src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            --init-script ../tools/case-study/print-jmh-classpath.gradle \
            :jenetics:jmhJar :jenetics:printJmhClasspath
      - name: List and check the benchmarks
        run: |
          JAR=$(ls jenetics-src/jenetics/build/libs/*-jmh.jar | head -1)
          CP="$JAR:$(cat jenetics-src/jenetics/build/jmh-classpath.txt)"
          echo "JMH jar: $JAR"
          echo "Class path jars: $(echo "$CP" | tr ':' '\n' | grep '\.jar$' | sed 's|.*/||' | tr '\n' ' ')"
          java -version
          java -cp "$CP" org.openjdk.jmh.Main -l > benchmarks-${{ matrix.pos }}.txt
          echo "| Pos | Commit | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/case-study/check_benchmarks.py benchmarks-${{ matrix.pos }}.txt ${{ matrix.pos }} ${{ matrix.sha }} | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Java: $(java -version 2>&1 | head -2 | tail -1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-list-${{ matrix.pos }}
          path: benchmarks-${{ matrix.pos }}.txt
          if-no-files-found: ignore
